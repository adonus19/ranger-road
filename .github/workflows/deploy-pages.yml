name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits instead of cancelling one in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Run unit tests
        run: npx ng test --watch=false

      - id: pages
        uses: actions/configure-pages@v6

      # base_path is /ranger-road for the project site, or empty on a custom domain.
      - name: Build for the Pages path
        run: npx ng build --base-href "${{ steps.pages.outputs.base_path }}/"

      # Pages has no rewrite rules, so opening or refreshing a deep link like /road/log
      # would 404. Serving the app as the 404 page lets the router take over.
      - name: Add the deep-link fallback
        run: cp dist/rangers-road/browser/index.html dist/rangers-road/browser/404.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist/rangers-road/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
