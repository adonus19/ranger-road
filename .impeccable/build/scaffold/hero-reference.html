<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: field-manual-switch-v2.png</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Uncial+Antiqua:wght@400&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#f7f6e7}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:864px">
  <div class="r-header-bar region chrome" data-region="header-bar"><!-- flat night-forest header bar across the top --></div>
  <div class="r-brand-mark region chrome" data-region="brand-mark"><!-- small gold three-pine mark --></div>
  <div class="r-app-title region text" data-region="app-title"><!-- serif app title The Ranger's Road in cream --><p style="font-size:var(--r-app-title-font);line-height:1.05;margin:0">app-title</p></div>
  <div class="r-page-title region text" data-region="page-title"><!-- large serif page title Field Manual --><p style="font-size:var(--r-page-title-font);font-family:var(--r-page-title-family),sans-serif;font-weight:var(--r-page-title-weight);line-height:1.05;margin:0">page-title</p></div>
  <div class="r-switch region control" data-region="switch"><!-- segmented three-way switch, 1px rule border, 6px outer corners, full width: rebuild the control's chrome from the crop (comp-spec.mjs --crop switch); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-switch-selected region control" data-region="switch-selected"><!-- selected This week segment filled night-forest pine: rebuild the control's chrome from the crop (comp-spec.mjs --crop switch-selected); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-switch-this-week region text" data-region="switch-this-week"><!-- sans label This week in cream on the selected segment --><p style="font-size:var(--r-switch-this-week-font);line-height:1.05;margin:0">switch-this-week</p></div>
  <div class="r-switch-contents region text" data-region="switch-contents"><!-- sans label Contents in secondary ink --><p style="font-size:var(--r-switch-contents-font);line-height:1.05;margin:0">switch-contents</p></div>
  <div class="r-switch-index region text" data-region="switch-index"><!-- sans label Index in secondary ink --><p style="font-size:var(--r-switch-index-font);line-height:1.05;margin:0">switch-index</p></div>
  <div class="r-week-heading region text" data-region="week-heading"><!-- serif section heading Week 2 · Keep Your Word --><p style="font-size:var(--r-week-heading-font);line-height:1.05;margin:0">week-heading</p></div>
  <div class="r-week-subline region text" data-region="week-subline"><!-- sans subline Chapter I · The Muster in secondary ink --><p style="font-size:var(--r-week-subline-font);line-height:1.05;margin:0">week-subline</p></div>
  <div class="r-rule-this-week region chrome" data-region="rule-this-week"><!-- hairline rule above the rows --></div>
  <div class="r-lesson-medallion region chrome" data-region="lesson-medallion"><!-- round medallion ground with a gold heart pictogram (icon-sized) --></div>
  <div class="r-lesson-title region text" data-region="lesson-title"><!-- serif row title Keep small promises --><p style="font-size:var(--r-lesson-title-font);line-height:1.05;margin:0">lesson-title</p></div>
  <div class="r-lesson-line region text" data-region="lesson-line"><!-- sans line Leadership lesson · Read Monday, about 3 minutes in secondary ink --><p style="font-size:var(--r-lesson-line-font);line-height:1.05;margin:0">lesson-line</p></div>
  <div class="r-lesson-arrow region control" data-region="lesson-arrow"><!-- thin right arrow: rebuild the control's chrome from the crop (comp-spec.mjs --crop lesson-arrow); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-rule-lesson region chrome" data-region="rule-lesson"><!-- soft hairline between rows --></div>
  <div class="r-tool-medallion region chrome" data-region="tool-medallion"><!-- round medallion ground with a gold hatchet pictogram (icon-sized) --></div>
  <div class="r-tool-title region text" data-region="tool-title"><!-- serif row title Tool inspection --><p style="font-size:var(--r-tool-title-font);line-height:1.05;margin:0">tool-title</p></div>
  <div class="r-tool-line region text" data-region="tool-line"><!-- sans line Field card · Wednesday or Saturday in secondary ink --><p style="font-size:var(--r-tool-line-font);line-height:1.05;margin:0">tool-line</p></div>
  <div class="r-tool-arrow region control" data-region="tool-arrow"><!-- thin right arrow: rebuild the control's chrome from the crop (comp-spec.mjs --crop tool-arrow); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-rule-tool region chrome" data-region="rule-tool"><!-- soft hairline between rows --></div>
  <div class="r-reading-medallion region chrome" data-region="reading-medallion"><!-- round medallion ground with a gold open-book pictogram (icon-sized) --></div>
  <div class="r-reading-title region text" data-region="reading-title"><!-- serif row title Habits of the Household --><p style="font-size:var(--r-reading-title-font);line-height:1.05;margin:0">reading-title</p></div>
  <div class="r-reading-line region text" data-region="reading-line"><!-- sans line Reading · Wednesday and Friday, 10 minutes in secondary ink --><p style="font-size:var(--r-reading-line-font);line-height:1.05;margin:0">reading-line</p></div>
  <div class="r-reading-arrow region control" data-region="reading-arrow"><!-- thin right arrow: rebuild the control's chrome from the crop (comp-spec.mjs --crop reading-arrow); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-rule-reading region chrome" data-region="rule-reading"><!-- soft hairline between rows --></div>
  <div class="r-scripture-medallion region chrome" data-region="scripture-medallion"><!-- round medallion ground with a gold sunrise pictogram (icon-sized) --></div>
  <div class="r-scripture-title region text" data-region="scripture-title"><!-- serif row title Matthew 5:33–37 --><p style="font-size:var(--r-scripture-title-font);line-height:1.05;margin:0">scripture-title</p></div>
  <div class="r-scripture-line region text" data-region="scripture-line"><!-- sans line Scripture today · six more this week in secondary ink --><p style="font-size:var(--r-scripture-line-font);line-height:1.05;margin:0">scripture-line</p></div>
  <div class="r-scripture-arrow region control" data-region="scripture-arrow"><!-- thin right arrow: rebuild the control's chrome from the crop (comp-spec.mjs --crop scripture-arrow); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-rule-scripture region chrome" data-region="rule-scripture"><!-- soft hairline between rows --></div>
  <div class="r-forge-medallion region chrome" data-region="forge-medallion"><!-- round medallion ground with a gold anvil pictogram (icon-sized) --></div>
  <div class="r-forge-title region text" data-region="forge-title"><!-- serif row title Forge and Restoration --><p style="font-size:var(--r-forge-title-font);line-height:1.05;margin:0">forge-title</p></div>
  <div class="r-forge-line region text" data-region="forge-line"><!-- sans line Exercise guides · 18 movements this week in secondary ink --><p style="font-size:var(--r-forge-line-font);line-height:1.05;margin:0">forge-line</p></div>
  <div class="r-forge-arrow region control" data-region="forge-arrow"><!-- thin right arrow: rebuild the control's chrome from the crop (comp-spec.mjs --crop forge-arrow); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-rule-forge region chrome" data-region="rule-forge"><!-- hairline closing the rows --></div>
  <div class="r-nav-bar region chrome" data-region="nav-bar"><!-- bottom navigation bar on paper with hairline top rule --></div>
  <div class="r-nav-keep region control" data-region="nav-keep"><!-- Keep tab: gray house line icon and label: rebuild the control's chrome from the crop (comp-spec.mjs --crop nav-keep); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-nav-road region control" data-region="nav-road"><!-- Road tab: gray road icon and label: rebuild the control's chrome from the crop (comp-spec.mjs --crop nav-road); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-nav-forge region control" data-region="nav-forge"><!-- Forge tab: gray anvil icon and label: rebuild the control's chrome from the crop (comp-spec.mjs --crop nav-forge); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-nav-journal region control" data-region="nav-journal"><!-- Journal tab: gray open-book icon and label: rebuild the control's chrome from the crop (comp-spec.mjs --crop nav-journal); its ink box, border, fill, radius, and label size are the comp's --></div>
  <div class="r-nav-field-manual region control" data-region="nav-field-manual"><!-- selected Field Manual tab: pine folded-map icon, pine label, short gold underline: rebuild the control's chrome from the crop (comp-spec.mjs --crop nav-field-manual); its ink box, border, fill, radius, and label size are the comp's --></div>
</main>
</body>
</html>
