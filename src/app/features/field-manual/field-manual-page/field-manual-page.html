<div class="field-manual page">
  <h1>Field Manual</h1>

  <nav class="views" aria-label="Field Manual views">
    @for (view of views; track view.path) {
      <a
        class="views__option"
        [routerLink]="view.path"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: view.exact }"
        ariaCurrentWhenActive="page"
        >{{ view.label }}</a
      >
    }
  </nav>

  <router-outlet />
</div>
