<section class="saved" role="status" aria-labelledby="saved-title">
  <h2 id="saved-title" tabindex="-1">Walk saved</h2>
  <p class="saved__date">{{ date() }}</p>
  <p class="saved__summary">
    @for (line of lines(); track $index) {
      <span class="line">{{ line }}</span>
    }
  </p>
  @if (pain(); as pain) {
    <p class="saved__pain">{{ pain }}</p>
  }
  <a class="primary-button" [routerLink]="backPath()">{{ backLabel() }}</a>
  <button type="button" class="secondary-button" (click)="another.emit()">Log another walk</button>
</section>
