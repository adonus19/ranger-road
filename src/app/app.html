<a class="skip-link" href="#main-content">Skip to content</a>

<div class="app-frame">
  <header class="site-header" [class.site-header--over-scene]="headerOverScene()">
    <div class="site-header__inner">
      <a class="brand" routerLink="/keep" aria-label="The Ranger’s Road, Keep">
        <svg class="brand__mark" viewBox="0 0 36 40" aria-hidden="true" focusable="false">
          <path
            d="M8 10.5 11 16H9.8l2.7 6H11l3 7H2l3-7H3.5l2.7-6H5ZM28 10.5 31 16h-1.2l2.7 6H31l3 7H22l3-7h-1.5l2.7-6H25ZM18 2l3.6 7.2h-1.7l3.7 7.4h-2l4.4 8.6H10l4.4-8.6h-2l3.7-7.4h-1.7Z"
          />
          <path d="M7.3 29h1.4v8H7.3ZM27.3 29h1.4v8h-1.4ZM17.2 25.2h1.6V38h-1.6Z" />
        </svg>
        <span>The Ranger’s Road</span>
      </a>
    </div>
  </header>

  <main id="main-content" class="site-main" tabindex="-1">
    <router-outlet />
  </main>

  <nav class="primary-nav" aria-label="Primary navigation">
    <div class="primary-nav__inner">
      @for (item of navItems; track item.path) {
        <a
          class="primary-nav__link"
          [routerLink]="item.path"
          routerLinkActive="is-active"
          #linkState="routerLinkActive"
          [routerLinkActiveOptions]="{ exact: false }"
          [attr.aria-current]="linkState.isActive ? 'page' : null"
        >
          <app-icon [name]="item.icon" [filled]="item.fillWhenActive && linkState.isActive" />
          <span>{{ item.label }}</span>
        </a>
      }
    </div>
  </nav>
</div>
